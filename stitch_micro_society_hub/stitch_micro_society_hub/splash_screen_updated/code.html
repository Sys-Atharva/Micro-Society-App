<!-- Micro-Interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingBar = document.getElementById('loading-bar');
            let progress = 0;
            
            // Simulating a sophisticated loading sequence
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    // Subtle haptic feel on completion
                    setTimeout(() => {
                        loadingBar.classList.add('shadow-[0_0_15px_#6063ee]');
                    }, 200);
                }
                loadingBar.style.width = `${progress}%`;
            }, 400);

            // Add subtle mouse-parallax effect to the icon
            document.addEventListener('mousemove', (e) => {
                const icon = document.querySelector('.group');
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                icon.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        });
    </script>
