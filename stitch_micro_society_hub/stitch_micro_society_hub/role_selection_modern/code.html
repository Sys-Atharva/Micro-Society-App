        }
        .glass-card {

        }
        .glass-card:hover {

        }
        .role-selected {

<body class="flex flex-col min-h-screen">
<!-- Subtle Background Elements -->
<div aria-hidden="true" class="floating-bg top-[-10%] left-[-10%]"></div>
<div aria-hidden="true" class="floating-bg bottom-[-10%] right-[-10%]"></div>
<!-- Top Navigation Anchor (Suppressed in Shell Logic for Transactional but added minimalist logo) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-margin-mobile md:px-margin-desktop py-stack-md bg-surface/80 backdrop-blur-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">hub</span>
<span class="font-headline-md-mobile md:font-headline-md font-bold tracking-tight text-on-surface">Micro-Society</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-stack-lg mt-16">
<!-- Hero Section -->
<div class="text-center mb-stack-lg max-w-2xl">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-stack-sm">Who are you?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Choose your role to get started.</p>
</div>
<!-- Role Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter-mobile md:gap-gutter-desktop w-full max-w-4xl">
<!-- Owner Role Card -->
<button class="glass-card group flex flex-col p-stack-lg rounded-xl text-left cursor-pointer outline-none ring-offset-2 focus:ring-2 focus:ring-secondary" id="role-owner" onclick="selectRole('owner')">
<div class="w-16 h-16 rounded-xl bg-secondary-fixed flex items-center justify-center mb-stack-md group-hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-on-secondary-fixed text-4xl group-hover:text-on-secondary-container transition-colors" data-icon="domain">domain</span>
</div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-stack-xs">Owner</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Manage your properties, handle maintenance requests, and oversee community developments efficiently.</p>
<div class="mt-auto flex items-center font-label-md text-label-md text-secondary gap-2 group-hover:gap-3 transition-all">
<span>Select Owner Access</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</div>
</button>
<!-- Tenant Role Card -->
<button class="glass-card group flex flex-col p-stack-lg rounded-xl text-left cursor-pointer outline-none ring-offset-2 focus:ring-2 focus:ring-secondary" id="role-tenant" onclick="selectRole('tenant')">
<div class="w-16 h-16 rounded-xl bg-surface-container flex items-center justify-center mb-stack-md group-hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-secondary text-4xl" data-icon="house">house</span>
</div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-stack-xs">Tenant</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Report issues, browse local events, pay rent, and connect with your neighbors in the community.</p>
<div class="mt-auto flex items-center font-label-md text-label-md text-secondary gap-2 group-hover:gap-3 transition-all">
<span>Select Tenant Access</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</div>
</button>
</div>
<!-- Interaction Details / Visual Polish -->
<div class="mt-stack-lg grid grid-cols-1 md:grid-cols-3 gap-stack-md w-full max-w-4xl opacity-60">
<div class="flex items-center gap-stack-sm p-stack-sm">
<span class="material-symbols-outlined text-on-surface-variant text-body-md">verified_user</span>
<span class="font-caption text-caption text-on-surface-variant">Verified Identities</span>
</div>
<div class="flex items-center gap-stack-sm p-stack-sm">
<span class="material-symbols-outlined text-on-surface-variant text-body-md">lock</span>
<span class="font-caption text-caption text-on-surface-variant">Secure Data Encryption</span>
</div>
<div class="flex items-center gap-stack-sm p-stack-sm">
<span class="material-symbols-outlined text-on-surface-variant text-body-md">bolt</span>
<span class="font-caption text-caption text-on-surface-variant">Real-time Coordination</span>
</div>
</div>
<!-- Primary Action Button (Initially Hidden until selection) -->
<div class="fixed bottom-margin-mobile md:bottom-margin-desktop left-0 w-full flex justify-center pointer-events-none opacity-0 translate-y-4 transition-all duration-300" id="continue-container">
<button class="pointer-events-auto h-11 px-stack-lg bg-secondary text-on-secondary font-label-md text-label-md rounded-xl shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 transition-all">

            </button>

<footer class="mt-auto py-stack-lg px-margin-mobile text-center">
<p class="font-caption text-caption text-on-surface-variant/50">© 2024 Micro-Society Inc. All rights reserved.</p>
</footer>
<script>
        function selectRole(role) {
            const ownerCard = document.getElementById('role-owner');
            const tenantCard = document.getElementById('role-tenant');
            const continueBtn = document.getElementById('continue-container');

            // Reset states
            ownerCard.classList.remove('role-selected');
            tenantCard.classList.remove('role-selected');

            // Apply active state
            if(role === 'owner') {
                ownerCard.classList.add('role-selected');
            } else {
                tenantCard.classList.add('role-selected');
            }

            // Show continue button
            continueBtn.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            continueBtn.classList.add('opacity-100', 'translate-y-0');

            // Haptic-like feedback if supported
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }
    </script>
